<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New lead — Peninsula Pavers</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #1c1c1c;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background-color: #f4f4f5; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="600"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 600px;
              width: 100%;
              background-color: #ffffff;
              border: 1px solid #e4e4e7;
              border-radius: 12px;
              overflow: hidden;
            "
          >
            <!-- Header -->
            <tr>
              <td
                style="background-color: #212c6a; padding: 8px 28px; border-radius: 12px 12px 0 0"
              >
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td width="42%" valign="middle" style="padding-right: 20px">
                      <img
                        src="{{site_url}}/images/Peninsula-Pavers-logo.webp"
                        alt="{{site_name}}"
                        style="
                          display: block;
                          max-width: 190px;
                          width: 100%;
                          height: auto;
                          border: 0;
                        "
                      />
                    </td>
                    <td
                      width="58%"
                      valign="middle"
                      style="text-align: right; font-family: Arial, Helvetica, sans-serif"
                    >
                      <div
                        style="
                          margin: 0 0 5px;
                          font-size: 14px;
                          line-height: 1.2;
                          font-weight: 700;
                          letter-spacing: 1.4px;
                          color: #ffffff;
                        "
                      >
                        PENINSULA PAVERS
                      </div>
                      <div
                        style="
                          margin: 0;
                          font-size: 11px;
                          line-height: 1.3;
                          font-weight: 600;
                          letter-spacing: 1.6px;
                          color: rgba(255, 255, 255, 0.7);
                        "
                      >
                        NEW LEAD
                      </div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                  <tr>
                    <td style="padding: 0 0 20px; border-bottom: 1px solid #e4e4e7">
                      <div
                        style="
                          margin: 0 0 6px;
                          font-size: 11px;
                          line-height: 1.2;
                          font-weight: 700;
                          letter-spacing: 1.2px;
                          text-transform: uppercase;
                          color: #71717a;
                        "
                      >
                        SUBJECT
                      </div>
                      <div
                        style="
                          margin: 0;
                          font-size: 21px;
                          line-height: 1.35;
                          font-weight: 700;
                          color: #1c1c1c;
                        "
                      >
                        {{subject_line}}
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 8px 0; border-bottom: 1px solid #e4e4e7">
                      <strong
                        style="
                          display: block;
                          font-size: 12px;
                          text-transform: uppercase;
                          letter-spacing: 1px;
                          color: #71717a;
                        "
                        >Name</strong
                      >
                      <span style="font-size: 16px">{{name}}</span>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 8px 0; border-bottom: 1px solid #e4e4e7">
                      <strong
                        style="
                          display: block;
                          font-size: 12px;
                          text-transform: uppercase;
                          letter-spacing: 1px;
                          color: #71717a;
                        "
                        >Email</strong
                      >
                      <a href="mailto:{{email_raw}}" style="font-size: 16px; color: #1e3a5f"
                        >{{email}}</a
                      >
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 8px 0; border-bottom: 1px solid #e4e4e7">
                      <strong
                        style="
                          display: block;
                          font-size: 12px;
                          text-transform: uppercase;
                          letter-spacing: 1px;
                          color: #71717a;
                        "
                        >Phone</strong
                      >
                      <span style="font-size: 16px">{{phone}}</span>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 8px 0; border-bottom: 1px solid #e4e4e7">
                      <strong
                        style="
                          display: block;
                          font-size: 12px;
                          text-transform: uppercase;
                          letter-spacing: 1px;
                          color: #71717a;
                        "
                        >Services</strong
                      >
                      <span style="font-size: 16px">{{services}}</span>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 8px 0; border-bottom: 1px solid #e4e4e7">
                      <strong
                        style="
                          display: block;
                          font-size: 12px;
                          text-transform: uppercase;
                          letter-spacing: 1px;
                          color: #71717a;
                        "
                        >How they heard about us</strong
                      >
                      <span style="font-size: 16px">{{hear_about_us}}</span>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 16px 0 0">
                      <strong
                        style="
                          display: block;
                          font-size: 12px;
                          text-transform: uppercase;
                          letter-spacing: 1px;
                          color: #71717a;
                          margin-bottom: 8px;
                        "
                        >Message</strong
                      >
                      <p
                        style="margin: 0; font-size: 16px; line-height: 1.6; white-space: pre-wrap"
                      >
                        {{message}}
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 16px 32px 24px;
                  background-color: #212c6a;
                  border-top: 1px solid #212c6a;
                  border-radius: 0 0 12px 12px;
                "
              >
                <p
                  style="
                    margin: 0;
                    font-size: 13px;
                    line-height: 1.5;
                    color: rgba(255, 255, 255, 0.7);
                    text-align: center;
                  "
                >
                  Submitted via {{form_source}} on {{submitted_at}}
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
